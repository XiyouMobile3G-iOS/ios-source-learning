# .github/workflows/pr-review-watchdog.yml (installed by pr-review-swarm deploy)
# Pinned to dustPyrotechnic/pr-review-swarm@v1.
# `v1` is a moving major tag — central releases roll out here automatically.
# To change the pin, re-run `pr-agent deploy --force` (add `--pin-sha` for an immutable pin).
name: PR Review Swarm Watchdog
# 兜底巡检，清理「运行已经死了、Check 还卡在 in_progress」的孤儿。它不替代 pr-review.yml
# 的事件触发，只负责那些「不会再有下一次 PR 事件来收尾」的死角。
#
# 扫描间隔：30m（改用 `pr-agent deploy --watchdog-interval=<N>m|<N>h --force` 重装）
# 最坏清理延迟 = 超时阈值 10 分钟 + 最长扫描间隙 30m = 40m
#
# 在这段延迟内，卡住的 Check 会一直显示"审核中"；若它是必需检查，对应 PR 也一直无法合并。
# 间隔越大空跑轮次越少（省速率配额、少撞 GitHub 抖动），代价就是这个延迟越长。
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  watchdog:
    uses: dustPyrotechnic/pr-review-swarm/.github/workflows/reusable-pr-review-watchdog.yml@v1
